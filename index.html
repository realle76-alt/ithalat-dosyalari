<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İthalat Dosyaları</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="İthalat">
<meta name="theme-color" content="#243b8f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Yerleşim: solda sabit ray, sağda tek sütun çalışma alanı. Telefonda ray alt sekme çubuğuna iner. */
:root{
  --bg:#eceff3; --surface:#ffffff; --sunk:#e1e5eb; --ink:#151a25; --muted:#586173; --line:#d0d6df;
  --accent:#243b8f; --accent-ink:#ffffff; --accent-soft:#e2e7f8;
  --it:#0b6e63; --it-soft:#d9f0ec; --cn:#96285f; --cn-soft:#f6dfeb;
  --ok:#1b6e37; --ok-soft:#dcf1e3; --warn:#7c5200; --warn-soft:#fbeecb; --crit:#ac241c; --crit-soft:#fbe2e0;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10131a; --surface:#191d27; --sunk:#232836; --ink:#e8ebf2; --muted:#9aa3b5; --line:#303748;
    --accent:#8fa6ff; --accent-ink:#0d1330; --accent-soft:#222c52;
    --it:#5fd1c2; --it-soft:#12352f; --cn:#f08fbf; --cn-soft:#3d1a2c;
    --ok:#6fd392; --ok-soft:#143322; --warn:#f0c264; --warn-soft:#3a2d0c; --crit:#ff9087; --crit-soft:#421a17;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10131a; --surface:#191d27; --sunk:#232836; --ink:#e8ebf2; --muted:#9aa3b5; --line:#303748;
  --accent:#8fa6ff; --accent-ink:#0d1330; --accent-soft:#222c52;
  --it:#5fd1c2; --it-soft:#12352f; --cn:#f08fbf; --cn-soft:#3d1a2c;
  --ok:#6fd392; --ok-soft:#143322; --warn:#f0c264; --warn-soft:#3a2d0c; --crit:#ff9087; --crit-soft:#421a17;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px;font-weight:700;line-height:1.15}
h2{font-size:17px;font-weight:700}
h3{font-size:14px;font-weight:700}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.1;padding:0 8px}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted);margin-top:4px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500}
.nav a:hover{background:var(--sunk)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav .count{font-family:var(--mono);font-size:12px;color:var(--muted)}
.rail .btn{width:100%}
.rail-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 8px}
main{padding:24px clamp(16px,3vw,36px) 48px;min-width:0;max-width:1120px;width:100%}
.tabbar{display:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 13px;font-weight:500;cursor:pointer;min-height:38px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.danger{color:var(--crit)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}

.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}
.head p{margin:4px 0 0;color:var(--muted)}
.banner{border-radius:var(--r);padding:10px 14px;margin-bottom:14px;font-size:14px;border:1px solid transparent}
.banner.warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 25%,transparent)}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.banner.crit{background:var(--crit-soft);color:var(--crit)}

.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile b{display:block;font-family:var(--display);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.tile span{font-size:12.5px;color:var(--muted)}
.tile.alert b{color:var(--warn)}

.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:500;color:var(--muted);min-height:32px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
input[type=text],input[type=search],input[type=date],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px;width:100%}
textarea{min-height:76px;resize:vertical}
.filters input[type=search]{flex:1 1 200px;width:auto}

.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1.6fr) auto;gap:8px 18px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;width:100%}
.row:hover{border-color:var(--muted)}
.row.it{border-left-color:var(--it)} .row.cn{border-left-color:var(--cn)}
.row .no{font-family:var(--mono);font-weight:500}
.row .sup{font-weight:600;overflow-wrap:anywhere}
.row .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.row .total{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.chip.it{background:var(--it-soft);color:var(--it)} .chip.cn{background:var(--cn-soft);color:var(--cn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.crit{background:var(--crit-soft);color:var(--crit)}
.steps{display:flex;gap:3px;margin-bottom:5px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--sunk)}
.steps i.on{background:var(--accent)}
.steps i.now{background:repeating-linear-gradient(90deg,var(--accent) 0 4px,var(--accent-soft) 4px 8px)}

.ohead{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.ohead.it{border-top-color:var(--it)} .ohead.cn{border-top-color:var(--cn)}
.ohead-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-start}
.ohead .no{font-family:var(--mono);color:var(--muted);font-size:13px}
.ohead .facts{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:13.5px;color:var(--muted)}
.ohead .facts b{color:var(--ink);font-weight:500}
.back{display:inline-flex;margin-bottom:10px;color:var(--muted);text-decoration:none;font-size:14px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{border:0;background:transparent;padding:10px 12px;cursor:pointer;font-weight:500;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs .n{font-family:var(--mono);font-size:12px;margin-left:4px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:600;border-top:1px solid var(--line)}
th.num,td.num{text-align:right}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:12px}
.split .card{margin:0}
.split b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}

.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.photo{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--sunk)}
.photo button.view{display:block;border:0;padding:0;background:none;cursor:zoom-in;width:100%}
.photo img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}
.photo .cap{padding:6px 8px;font-size:12px;display:flex;justify-content:space-between;gap:6px;align-items:center;background:var(--surface)}
.photo .cap span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted);background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}

.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.timeline li:last-child{border-bottom:0}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);margin-left:3px}
.done .dot{background:var(--accent);border-color:var(--accent)}
.now .dot{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.timeline .lab{font-weight:500}
.timeline .pending .lab{color:var(--muted)}
.timeline .ctl{display:flex;gap:6px;align-items:center}
.timeline input[type=date]{width:150px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.f.wide{grid-column:1/-1}

.doclist{list-style:none;margin:0;padding:0}
.doclist li{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.doclist li:last-child{border-bottom:0}
.doclist .files{display:flex;flex-direction:column;gap:3px;font-size:13px;margin-top:3px}
.doclist a{color:var(--accent)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;min-height:0;padding:0}
.empty{text-align:center;color:var(--muted);padding:28px 12px}

.layer{position:fixed;inset:0;background:rgba(10,14,24,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.dialog{background:var(--surface);border-radius:14px;padding:18px;width:min(560px,100%);max-height:calc(100% - 16px);overflow:auto;border:1px solid var(--line)}
.dialog h2{margin-bottom:12px}
.dialog .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.lightbox img{max-width:100%;max-height:calc(100vh - 90px);border-radius:8px;display:block;margin:0 auto}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:9px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}

@media (max-width:760px){
  .app{display:block}
  .rail{display:none}
  main{padding:16px 16px 96px}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:10}
  .tabbar a{padding:13px 6px 15px;text-align:center;text-decoration:none;color:var(--muted);font-weight:500;font-size:13.5px}
  .tabbar a[aria-current="page"]{color:var(--accent);box-shadow:inset 0 2px 0 var(--accent)}
  .tiles{grid-template-columns:1fr 1fr}
  .row{grid-template-columns:1fr}
  .row .total{text-align:left}
  h1{font-size:22px}
  .timeline li{grid-template-columns:22px minmax(0,1fr)}
  .timeline .ctl{grid-column:2}
  table.items thead{display:none}
  table.items,table.items tbody,table.items tr,table.items td{display:block}
  table.items tr{border-bottom:1px solid var(--line);padding:8px 0}
  table.items td{border:0;padding:2px 0;text-align:left}
  table.items td[data-l]::before{content:attr(data-l) ": ";color:var(--muted);font-size:12.5px}
  table.items tfoot tr{border:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.dialog.wide{width:min(900px,100%)}
.rv-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.rv{display:grid;grid-template-columns:auto 130px minmax(0,1fr) 84px 104px 124px;gap:8px;align-items:end;border:1px solid var(--line);border-radius:8px;padding:8px}
.rv-on{display:flex;flex-direction:column;align-items:center;gap:4px;padding-bottom:8px}
.rv-on input{width:20px;height:20px}
@media (max-width:760px){.rv{grid-template-columns:auto minmax(0,1fr) minmax(0,1fr)}.rv-on{grid-row:1/span 4}.rv .rv-d{grid-column:2/-1}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">İthalat Dosyaları<small>İtalya ve Çin siparişleri</small></div>
    <nav class="nav" aria-label="Bölümler">
      <a href="#siparisler" data-nav="siparisler">Siparişler <span class="count" id="navCount"></span></a>
      <a href="#arsiv" data-nav="arsiv">Belge arşivi <span class="count" id="navDocs"></span></a>
      <a href="#hesap" data-nav="hesap">Hesap ve tanılama</a>
    </nav>
    <button class="btn primary" data-act="new-order">Yeni sipariş</button>
    <div class="rail-foot" id="railFoot"></div>
  </aside>
  <main id="main" aria-live="polite"></main>
</div>
<nav class="tabbar" aria-label="Bölümler">
  <a href="#siparisler" data-nav="siparisler">Siparişler</a>
  <a href="#yeni" data-act="new-order">Yeni</a>
  <a href="#arsiv" data-nav="arsiv">Arşiv</a>
  <a href="#hesap" data-nav="hesap">Hesap</a>
</nav>
<div id="layer"></div>
<div id="toast" class="toast" hidden></div>
<script src="config.js?v=3"></script>
<script>
"use strict";
const APP_VERSION="0.5.1";
/* ---------- Sabitler ---------- */
const STAGES=[
  {k:"siparis",l:"Sipariş verildi",wait:"Taslak"},
  {k:"proforma",l:"Proforma alındı",wait:"Proforma bekleniyor"},
  {k:"odeme",l:"Ödeme yapıldı",wait:"Ödeme bekleniyor"},
  {k:"yukleme",l:"Yüklendi",wait:"Yükleme bekleniyor"},
  {k:"varis",l:"Gümrüğe geldi",wait:"Yolda"},
  {k:"tescil",l:"Beyanname tescil edildi",wait:"Gümrükte, beyanname bekleniyor",customs:true},
  {k:"vergi",l:"Vergiler ödendi",wait:"Gümrükte, vergi ödemesi bekleniyor",customs:true},
  {k:"depo",l:"Depoya girdi",wait:"Teslim bekleniyor"}
];
const COUNTRY={IT:"İtalya",CN:"Çin",TR:"Türkiye",XX:"Diğer"};
const CUSTOMS_WARN_DAYS=7;
function docTypesFor(o){
  const cnItem=(o.items||[]).some(i=>i.origin==="CN");
  const t=[
    {k:"proforma",l:"Proforma fatura",req:true},
    {k:"fatura",l:"Ticari fatura",req:true},
    {k:"ceki",l:"Çeki listesi",req:true}
  ];
  t.push({k:"tasima",l:"Taşıma belgesi (CMR / konşimento)",req:true});
  if(o.shipFrom==="CN"){
    t.push({k:"mense",l:"Menşe şahadetnamesi",req:true},{k:"ordino",l:"Ordino",req:false});
  }else{
    t.push({k:"atr",l:"A.TR dolaşım belgesi",req:true},{k:"mense",l:"Menşe beyanı / şahadetnamesi",req:cnItem,hint:cnItem?"Çin menşeli kalem olduğu için":"Müşavir isterse"});
  }
  t.push({k:"sigorta",l:"Sigorta poliçesi",req:false});
  t.push(
    {k:"beyanname",l:"Gümrük beyannamesi",req:true},
    {k:"makbuz",l:"Vergi tahakkuk ve makbuzu",req:true},
    {k:"musavir",l:"Müşavir faturası ve masraf dökümü",req:true},
    {k:"navlun",l:"Navlun faturası",req:true},
    {k:"odeme",l:"Ödeme dekontu (swift)",req:false},
    {k:"diger",l:"Diğer",req:false}
  );
  return t;
}

/* ---------- Yardımcılar ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const fmtDate=s=>{if(!s)return "";const p=String(s).slice(0,10).split("-");return p.length===3?p[2]+"."+p[1]+"."+p[0]:s};
const daysSince=s=>s?Math.max(0,Math.round((Date.parse(today())-Date.parse(s))/864e5)):null;
const nf=new Intl.NumberFormat("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2});
const nfi=new Intl.NumberFormat("tr-TR");
const money=(v,c)=>nf.format(v||0)+" "+(c||"");
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const lineTotal=i=>(Number(i.qty)||0)*(Number(i.price)||0);
const orderTotal=o=>(o.items||[]).reduce((s,i)=>s+lineTotal(i),0);
const orderQty=o=>(o.items||[]).reduce((s,i)=>s+(Number(i.qty)||0),0);
const stageLabel=(st,o)=>typeof st.l==="string"?st.l:(st.l[o.shipFrom]||st.l.IT);
function progress(o){
  const s=o.stages||{};const idx=STAGES.findIndex(st=>!s[st.k]);
  const done=idx===-1;const cur=done?null:STAGES[idx];
  let last=null;for(const st of STAGES){if(s[st.k]&&(!last||s[st.k]>last))last=s[st.k]}
  const wait=done?null:daysSince(last);
  return {idx:done?STAGES.length:idx,done,cur,status:done?"Tamamlandı":cur.wait,wait,
    inCustoms:!done&&!!cur.customs,onWay:!done&&cur.k==="varis",
    late:!done&&!!cur.customs&&wait!=null&&wait>=CUSTOMS_WARN_DAYS};
}
function missingDocs(o){
  const have=new Set((o.docs||[]).map(d=>d.type));
  return docTypesFor(o).filter(t=>t.req&&!have.has(t.k));
}
const mixedOrigin=o=>o.shipFrom==="IT"&&(o.items||[]).some(i=>i.origin==="CN");
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{t.hidden=true},4200)}

const PLACEHOLDER="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3 4"><rect width="3" height="4" fill="#d0d6df"/></svg>');
/* ---------- Durum, oturum ve Drive katmanı ---------- */
const CFG=window.ITHALAT_CONFIG||{};
const SCOPE="https://www.googleapis.com/auth/drive.file";

function setToken(tok,expiresIn,how){
  token=tok;tokenUntil=Date.now()+(Number(expiresIn)||3600)*1000;
  ss.set("ithalat.tok",JSON.stringify({token,tokenUntil}));
  S.auth="in";S.syncErr="";
  log("GİRİŞ BAŞARILI, yöntem: "+how+", süre (sn): "+expiresIn);
  render();boot();
}
function expire(){if(S.auth==="in"){S.auth="expired";token=null;ss.set("ithalat.tok",null);log("Oturum süresi doldu.");render()}}

function loginRedirect(){

function handleRedirectReturn(){
  if(!location.hash||location.hash.length<2)return null;
  const h=new URLSearchParams(location.hash.slice(1));
  if(!h.has("access_token")&&!h.has("error"))return null;
  history.replaceState(null,"",location.pathname+location.search+"#siparisler");
  if(h.has("error")){log("Yönlendirme girişi hata döndü: "+h.get("error"));return {error:"Giriş tamamlanmadı: "+h.get("error")}}
  const expected=ss.get("ithalat.state");ss.set("ithalat.state",null);
  if(!expected||expected!==h.get("state")){log("UYARI: Dönüşte güvenlik değeri (state) eşleşmedi. Giriş başka bir pencerede tamamlanmış olabilir. Belirteç kullanılmadı.");return {error:"Giriş bu pencereye geri dönmedi. Diğer giriş yöntemini deneyin."}}
  return {token:h.get("access_token"),expiresIn:h.get("expires_in")};
}

/* ---- Drive çağrıları ---- */
async function drive(url,opts){
  if(!token){expire();throw new Error("Oturum kapalı")}
  const o=Object.assign({},opts||{});o.headers=Object.assign({Authorization:"Bearer "+token},o.headers||{});
  let r;
  try{r=await fetch(url,o)}catch(e){throw new Error("Bağlantı yok")}
  if(!r.ok){
    let detail="";try{const j=await r.json();detail=(j.error&&j.error.message)||""}catch(e){}
    if(r.status===401)expire();
    const err=new Error("HTTP "+r.status+(detail?": "+detail:""));err.status=r.status;throw err;
  }
  return r;
}
const dq=s=>String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'");
async function listAll(query,fields){
  const out=[];let page="";
  do{
    const r=await drive(API+"/files?spaces=drive&pageSize=1000&fields="+encodeURIComponent("nextPageToken,files("+fields+")")+"&q="+encodeURIComponent(query)+(page?"&pageToken="+encodeURIComponent(page):""));
    const j=await r.json();out.push(...(j.files||[]));page=j.nextPageToken||"";
  }while(page);
  return out;
}
async function createFolder(name,parentId){
  const r=await drive(API+"/files?fields=id",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,mimeType:FOLDER_MIME,parents:[parentId]})});
  return (await r.json()).id;
}
async function findOrCreateFolder(name,parentId){
  const f=await listAll("name='"+dq(name)+"' and mimeType='"+FOLDER_MIME+"' and trashed=false and '"+dq(parentId)+"' in parents","id");
  return f.length?f[0].id:createFolder(name,parentId);
}
function multipart(meta,blob,type){
  const b="ithalat"+uid();
  return {body:new Blob(["--"+b+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n",JSON.stringify(meta),"\r\n--"+b+"\r\nContent-Type: "+type+"\r\n\r\n",blob,"\r\n--"+b+"--"]),headers:{"Content-Type":"multipart/related; boundary="+b}};
}
async function createFile(name,parentId,blob,type,fields){
  const m=multipart({name,parents:[parentId]},blob,type||"application/octet-stream");
  const r=await drive(UPLOAD+"?uploadType=multipart&fields="+encodeURIComponent(fields||"id,modifiedTime"),{method:"POST",headers:m.headers,body:m.body});
  return r.json();
}
async function updateFile(fileId,blob,type){
  const r=await drive(UPLOAD+"/"+encodeURIComponent(fileId)+"?uploadType=media&fields=id,modifiedTime",{method:"PATCH",headers:{"Content-Type":type},body:blob});
  return r.json();
}
async function patchMeta(fileId,body){

/* ---- Klasör düzeni: İthalat Arşivi / yıl / sipariş / (Belgeler, Fotoğraflar) ---- */
const cleanName=s=>String(s).replace(/[\\/:*?"<>|]+/g," ").replace(/\s+/g," ").trim();
const folderNameOf=o=>cleanName(o.no+" "+o.supplier);
async function ensureFolders(o){
  if(o.folderId)return;
  if(!rootId)rootId=await findOrCreateFolder(CFG.rootFolderName||"İthalat Arşivi","root");
  const y=String(o.orderDate||today()).slice(0,4);
  if(!yearIds[y])yearIds[y]=await findOrCreateFolder(y,rootId);
  o.folderId=await createFolder(folderNameOf(o),yearIds[y]);o.folderName=folderNameOf(o);
  log("Sipariş klasörü açıldı: "+o.folderName);
}
async function ensureSub(o,key,name){
  if(!o[key]){o[key]=await createFolder(name,o.folderId);o._dirty=true}
  return o[key];
}
function enqueue(id,fn){
  S.pending++;renderSync();
  const p=(queues[id]||Promise.resolve()).then(fn).finally(()=>{S.pending--;renderSync()});
  queues[id]=p.catch(()=>{});
  return p;
}
function bodyOf(o){const b={};for(const k in o){if(k[0]!=="_"&&k!=="fileId")b[k]=o[k]}return b}

/* Kaydetme: önce ekranda ve önbellekte, ardından sırayla Drive'da. */
function saveOrder(o){
  o.updatedAt=new Date().toISOString();o._dirty=true;
  const i=S.orders.findIndex(x=>x.id===o.id);if(i===-1)S.orders.push(o);else S.orders[i]=o;
  sortOrders();saveCache();render();
  return pushOrder(o.id);
}
function pushOrder(id){
  if(S.auth!=="in")return Promise.resolve();
  return enqueue(id,async()=>{
    const o=getOrder(id);if(!o||!o._dirty)return;
    await ensureFolders(o);
    const stamp=o.updatedAt;const blob=new Blob([JSON.stringify(bodyOf(o))],{type:"application/json"});
    const r=o.fileId?await updateFile(o.fileId,blob,"application/json"):await createFile(DATA_FILE,o.folderId,blob,"application/json");
    o.fileId=r.id;o._mtime=r.modifiedTime;
    if(o.updatedAt===stamp)o._dirty=false;
    if(o.folderName!==folderNameOf(o)){try{await patchMeta(o.folderId,{name:folderNameOf(o)});o.folderName=folderNameOf(o);o._dirty=true;log("Klasör adı güncellendi: "+o.folderName)}catch(e){log("Klasör adı değiştirilemedi: "+e.message)}}
    S.syncErr="";saveCache();
    if(o._dirty)setTimeout(()=>pushOrder(id),0);
  }).catch(e=>{S.syncErr=e.message;log("KAYIT HATASI ("+id+"): "+e.message);saveCache();renderSync()});
}
function pushAllDirty(){for(const o of S.orders){if(o._dirty)pushOrder(o.id)}}
async function removeOrder(o){
  S.orders=S.orders.filter(x=>x.id!==o.id);S.sel=null;saveCache();location.hash="#siparisler";render();
  if(o.folderId)enqueue(o.id,()=>patchMeta(o.folderId,{trashed:true})).then(()=>log("Sipariş klasörü Drive çöp kutusuna taşındı: "+o.no)).catch(e=>{log("Silme hatası: "+e.message);toast("Drive'daki klasör silinemedi. Drive'dan elle silebilirsiniz.")});
}
function trashFile(orderId,fileId){
  if(!fileId)return;
  enqueue(orderId,()=>patchMeta(fileId,{trashed:true})).catch(e=>log("Dosya çöpe taşınamadı: "+e.message));
}

/* Drive'dan okuma: yalnızca değişen sipariş dosyaları indirilir. */
async function syncDown(){
  if(S.auth!=="in"||S.syncing)return;
  S.syncing=true;renderSync();
  try{
    const files=await listAll("name='"+DATA_FILE+"' and trashed=false","id,modifiedTime,parents");
    const seen=new Set(files.map(f=>f.id));const need=[];
    for(const f of files){const c=S.orders.find(o=>o.fileId===f.id);if(c&&(c._dirty||c._mtime===f.modifiedTime))continue;need.push(f)}
    for(let i=0;i<need.length;i+=5){
      await Promise.all(need.slice(i,i+5).map(async f=>{
        try{
          const d=await readJson(f.id);if(!d||!d.id)return;
          const o=Object.assign(d,{fileId:f.id,_mtime:f.modifiedTime,_dirty:false});
          if(!o.folderId&&f.parents&&f.parents[0])o.folderId=f.parents[0];
          const k=S.orders.findIndex(x=>x.id===o.id);if(k===-1)S.orders.push(o);else if(!S.orders[k]._dirty)S.orders[k]=o;
        }catch(e){log("Sipariş dosyası okunamadı ("+f.id+"): "+e.message)}
      }));
    }
    S.orders=S.orders.filter(o=>o._dirty||!o.fileId||seen.has(o.fileId));
    sortOrders();S.loaded=true;S.syncErr="";saveCache();
    log("Drive ile eşitlendi: "+S.orders.length+" sipariş, "+need.length+" dosya indirildi.");
  }catch(e){S.syncErr=e.message;S.loaded=true;log("EŞİTLEME HATASI: "+e.message)}
  S.syncing=false;render();
}
async function boot(){
  try{const r=await drive(API+"/about?fields=user(emailAddress)");const j=await r.json();S.email=(j.user&&j.user.emailAddress)||"";ls.set("ithalat.email",S.email);log("Hesap: "+S.email)}catch(e){log("Hesap bilgisi alınamadı: "+e.message)}
  await syncDown();pushAllDirty();
}

/* ---- Görsel hazırlama ve yükleme ---- */
async function prepImage(file){
  const bmp=await createImageBitmap(file);
  const draw=max=>{const k=Math.min(1,max/Math.max(bmp.width,bmp.height));const c=document.createElement("canvas");c.width=Math.max(1,Math.round(bmp.width*k));c.height=Math.max(1,Math.round(bmp.height*k));c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);return c};
  const blob=await new Promise(r=>draw(1800).toBlob(r,"image/jpeg",.86));
  if(!blob)throw new Error("encode");
  return {blob,thumb:draw(240).toDataURL("image/jpeg",.6)};
}
const extOf=(name,type)=>{const m=/\.([a-z0-9]{2,5})$/i.exec(name||"");if(m)return m[1].toLowerCase();return type==="application/pdf"?"pdf":/^image\/(\w+)/.test(type||"")?RegExp.$1.replace("jpeg","jpg"):"bin"};

    try{

/* ---------- Belge okuma: metinden alan çıkarma (tamamı cihazda çalışır) ---------- */
function parseNum(raw){
  let s=String(raw).replace(/[^\d.,-]/g,"");
  if(!/\d/.test(s))return NaN;
  s=s.replace(/[.,]+$/,"");
  const lc=s.lastIndexOf(","),ld=s.lastIndexOf(".");
  if(lc>-1&&ld>-1){s=lc>ld?s.replace(/\./g,"").replace(",","."):s.replace(/,/g,"")}
  else if(lc>-1||ld>-1){
    const sep=lc>-1?",":".";const parts=s.split(sep);
    if(parts.length>2||(parts[1].length===3&&parts[0].length<=3&&parts[0]!=="0"))s=parts.join("");
    else s=parts[0]+"."+parts[1];
  }
  return Number(s);
}
const isDateTok=t=>/^\d{1,2}[.\/-]\d{1,2}[.\/-]\d{2,4}$/.test(t);
const isNumTok=t=>/^[€$£]?-?\d[\d.,]*[€$£%]?$/.test(t)&&!isDateTok(t);
const isCodeTok=t=>/^(?=.*\d)[A-Za-z0-9][A-Za-z0-9\-\/._]{2,}$/.test(t)&&!isDateTok(t);
const ORIGIN_RULES=[
  ["CN",/\b(?:made\s+in\s+|prodotto\s+in\s+|fabriqu[ée]\s+en\s+)?(?:china|cina|chine|çin|p\.?\s?r\.?\s?c\.?)\b|\(CN\)/i],
  ["IT",/\b(?:made\s+in\s+|prodotto\s+in\s+|fabriqu[ée]\s+en\s+)?(?:italy|italia|italie|italya)\b|\(IT\)/i],
  ["TR",/\b(?:made\s+in\s+|prodotto\s+in\s+)?(?:turkey|t[uü]rkiye|turchia)\b|\(TR\)/i]
];
function findOrigin(text){
  for(const [k,re] of ORIGIN_RULES){if(re.test(text))return k}
  const m=/\b(?:orig(?:in|ine)?|mense|menşe)\b\.?\s*[:\-]?\s*(CN|IT|TR)\b/i.exec(text);
  return m?m[1].toUpperCase():"";
}
function stripOrigin(text){
  let s=text;
  for(const [,re] of ORIGIN_RULES)s=s.replace(new RegExp(re.source,"gi")," ");
  return s.replace(/\(\s*\)/g," ").replace(/\s+/g," ").trim();
}
/* Bir satırda adet x birim fiyat = tutar eşitliğini sağlayan üç sayı aranır. Fatura kalemi olmanın ölçütü budur. */
function parseItemLine(line){
  const toks=line.trim().split(/\s+/).filter(Boolean);
  const nums=[];toks.forEach((t,i)=>{if(isNumTok(t)&&!/%$/.test(t)){const v=parseNum(t);if(isFinite(v))nums.push({i,v,t})}});
  if(nums.length<3)return null;
  let best=null;
  for(let c=nums.length-1;c>=2&&!best;c--){
    for(let b=c-1;b>=1&&!best;b--){
      for(let a=b-1;a>=0;a--){
        const q=nums[a].v,p=nums[b].v,t=nums[c].v;
        if(q<=0||p<=0||t<=0)continue;
        if(Math.abs(q*p-t)<=Math.max(0.011,t*0.0006)){best={a,b,c,q,p,t};if(Number.isInteger(q))break}
      }
    }
  }
  if(!best)return null;
  const qi=nums[best.a].i;const head=toks.slice(0,qi);
  let model="";let ci=head.findIndex(isCodeTok);
  if(ci===-1&&head.length&&/^\d{3,}$/.test(head[0]))ci=0;
  if(ci>-1){model=head[ci].replace(/[.,;:]+$/,"");head.splice(ci,1)}

const LIBS={
  tess:"https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js",
  pdf:"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",
  pdfWorker:"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js",
  xlsx:"https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"
};
async function readSheets(buf){
  await loadScript(LIBS.xlsx);
  const wb=XLSX.read(buf,{type:"array"});
  return wb.SheetNames.map(n=>({name:n,rows:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null,blankrows:false})}));
}
const READABLE={proforma:1,fatura:1};
const scriptP={};
function loadScript(src){
  if(!scriptP[src])scriptP[src]=new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=()=>res();s.onerror=()=>{delete scriptP[src];rej(new Error("Okuma bileşeni indirilemedi. İnternet bağlantınızı kontrol edin."))};document.head.appendChild(s)});
  return scriptP[src];
}
let ocrWorker=null,ocrStatus=null;
const setStatus=t=>{const el=$("#ocrStatus");if(el)el.textContent=t};
async function getOcr(){
  await loadScript(LIBS.tess);
  if(!ocrWorker){
    setStatus("Okuma bileşenleri hazırlanıyor (ilk kullanımda biraz sürer).");
    ocrWorker=await Tesseract.createWorker(["ita","eng"],1,{logger:m=>{if(m&&m.status==="recognizing text"&&ocrStatus)ocrStatus(Math.round((m.progress||0)*100))}});
    await ocrWorker.setParameters({tessedit_pageseg_mode:"6",preserve_interword_spaces:"1"});
  }
  return ocrWorker;
}
async function toOcrCanvas(blob,max){
  const bmp=await createImageBitmap(blob);const k=Math.min(1,(max||2600)/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);return c;
}
async function ocrImage(source,label){
  const w=await getOcr();
  ocrStatus=p=>setStatus((label||"Okunuyor")+": %"+p);
  const {data}=await w.recognize(source);ocrStatus=null;
  return {text:data.text||"",conf:Math.round(data.confidence||0)};
}
async function readDocText(blob,ct){
  if(ct==="application/pdf"||blob.type==="application/pdf"){
    setStatus("PDF açılıyor.");
    await loadScript(LIBS.pdf);pdfjsLib.GlobalWorkerOptions.workerSrc=LIBS.pdfWorker;
    const doc=await pdfjsLib.getDocument({data:await blob.arrayBuffer()}).promise;
    const pages=Math.min(doc.numPages,8);let lines=[];
    for(let n=1;n<=pages;n++){const pg=await doc.getPage(n);const tc=await pg.getTextContent();lines=lines.concat(linesFromPdfItems(tc.items))}
    const text=lines.join("\n");
    if(text.replace(/\s/g,"").length>=40)return {text,method:"PDF yazı katmanı",conf:null,pages:doc.numPages};
    let out="",conf=0;
    for(let n=1;n<=pages;n++){
      const pg=await doc.getPage(n);const vp=pg.getViewport({scale:2});
      const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;
      await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
      const r=await ocrImage(c,"Sayfa "+n+"/"+pages+" okunuyor");out+=r.text+"\n";conf+=r.conf;
    }
    return {text:out,method:"Taranmış PDF, görüntüden okuma",conf:Math.round(conf/pages),pages:doc.numPages};
  }
  setStatus("Görüntü hazırlanıyor.");
  const r=await ocrImage(await toOcrCanvas(blob),"Okunuyor");
  return {text:r.text,method:"Görüntüden okuma",conf:r.conf,pages:1};
}

async function readDocAction(o,n){
  const d=(o.docs||[])[n];if(!d)return;
  if(S.auth!=="in")return toast("Okumak için önce giriş yapın.");
  busyLayer("Belge okunuyor");
  try{
    const t0=Date.now();
    const blob=await driveBlob(d.id);
    let res,parsed;
    if(isSheetFile(d.orig||d.name,d.ct)){
      setStatus("Excel tablosu açılıyor.");
      const sheets=await readSheets(await blob.arrayBuffer());
      for(const sh of sheets){const p=parseInvoiceSheet(sh.rows);if(p&&p.items.length){parsed=p;break}}
      parsed=parsed||{no:"",date:"",currency:"",total:null,sum:0,items:[]};
      res={text:sheets.map(sh=>sh.rows.map(rowText).join("\n")).join("\n\n"),method:"Excel tablosu",conf:null,pages:1};
    }else{
      res=await readDocText(blob,d.ct);

/* ---- Karşılaştırma ---- */
function readItems(o,typeKey){
  const docs=(o.docs||[]).filter(d=>d.type===typeKey&&d.read);
  const items=[];for(const d of docs)for(const it of d.read.items)items.push(it);
  return {docs,items,total:docs.length&&docs.every(d=>d.read.total!=null)?docs.reduce((s,d)=>s+d.read.total,0):null};
}
function tabCompare(o){
  const pf=readItems(o,"proforma"),ft=readItems(o,"fatura");
  const keyOf=it=>normModel(it.model)||"~"+String(it.desc||"").toLocaleLowerCase("tr").replace(/\s+/g," ").trim();
  const match=codeMatcher(o.items||[]);
  const rows=new Map();
  const put=(src,it)=>{
    let k=keyOf(it),alias="";
    if(src!=="s"){const m=match(it);if(m){k=m.k;if(!m.exact)alias=it.model}}
    let r=rows.get(k);if(!r){r={model:it.model,desc:it.desc,company:"",alias:new Set(),s:null,p:null,f:null};rows.set(k,r)}
    if(alias)r.alias.add(alias);if(src==="s"&&it.company&&!r.company)r.company=it.company;
    if(!r[src])r[src]={qty:0,sum:0};r[src].qty+=Number(it.qty)||0;r[src].sum+=(Number(it.qty)||0)*(Number(it.price)||0);if(!r.desc)r.desc=it.desc;if(!r.model)r.model=it.model};
  (o.items||[]).forEach(it=>put("s",it));pf.items.forEach(it=>put("p",it));ft.items.forEach(it=>put("f",it));
  const price=c=>c&&c.qty?c.sum/c.qty:0;
  const cell=c=>c?'<span class="mono">'+nfi.format(c.qty)+' × '+nf.format(price(c))+'</span>':'<span class="muted">yok</span>';
  const diff=(a,b,an,bn)=>{const out=[];if(!a||!b)return out;
    if(a.qty!==b.qty)out.push(["warn","Adet: "+an+" "+nfi.format(a.qty)+", "+bn+" "+nfi.format(b.qty)]);
    if(Math.abs(price(a)-price(b))>0.005)out.push(["warn","Fiyat: "+an+" "+nf.format(price(a))+", "+bn+" "+nf.format(price(b))]);return out};
  let h="";
  if(!pf.docs.length&&!ft.docs.length)h+='<div class="banner info">Karşılaştırma için önce Belgeler sekmesinden proforma ya da ticari faturayı yükleyin, sonra dosyanın yanındaki <b>Kalemleri oku</b> düğmesine basın.</div>';
  let problems=0,qtyProblems=0,priceOnly=0;
  const out=[];
  for(const r of rows.values()){
    const flags=[];
    if((pf.docs.length||ft.docs.length)&&!r.s)flags.push(["crit","Siparişte yok"]);
    if(pf.docs.length&&r.s&&!r.p)flags.push(["crit","Proformada yok"]);
    if(ft.docs.length&&r.s&&!r.f)flags.push(["crit","Faturada yok"]);
    flags.push(...diff(r.s,r.p,"sipariş","proforma"));
    flags.push(...diff(r.s,r.f,"sipariş","fatura"));
    if(!r.s)flags.push(...diff(r.p,r.f,"proforma","fatura"));
    const any=pf.docs.length||ft.docs.length;
    if(flags.length)problems++;
    const sev=flags.some(f=>f[0]==="crit")?2:flags.some(f=>/^Adet/.test(f[1]))?1:flags.length?0.5:0;
    if(sev>=1)qtyProblems++;else if(sev)priceOnly++;
    const note=r.alias.size?'<div class="small muted">Belgede '+esc([...r.alias].join(", "))+' olarak yazılmış</div>':"";
    out.push([sev,'<tr><td><span class="mono">'+esc(r.model||"")+'</span><div class="small muted">'+esc([r.company,r.desc].filter(Boolean).join(" · "))+'</div></td><td class="num">'+cell(r.s)+'</td><td class="num">'+(pf.docs.length?cell(r.p):'<span class="muted">okunmadı</span>')+'</td><td class="num">'+(ft.docs.length?cell(r.f):'<span class="muted">okunmadı</span>')+'</td><td>'+(flags.length?flags.map(f=>'<span class="chip '+f[0]+'" style="white-space:normal;margin:1px 0">'+esc(f[1])+'</span>').join(" "):any?'<span class="chip ok">Uyumlu</span>':"")+note+'</td></tr>']);
  }
  const sumOf=src=>{let s=0;for(const r of rows.values())if(r[src])s+=r[src].sum;return s};
  const tot=(src,info)=>info.docs.length?'<span class="mono">'+nf.format(sumOf(src))+'</span>'+(info.total!=null&&Math.abs(info.total-sumOf(src))>0.02?'<div class="small" style="color:var(--warn)">belgede '+nf.format(info.total)+'</div>':""):'<span class="muted">okunmadı</span>';
  /* Eksik kalem ve adet farkları en üstte; yalnızca fiyatı farklı olanlar arkadan gelir. */
  const body=out.map((x,i)=>[x[0],i,x[1]]).sort((a,b)=>b[0]-a[0]||a[1]-b[1]).map(x=>x[2]).join("");
  if(pf.docs.length||ft.docs.length)h+='<div class="banner '+(problems?"warn":"info")+'">'+(problems?(qtyProblems?'<b>'+qtyProblems+' kalemde eksik kalem ya da adet farkı var.</b> Bunlar listenin başında. ':'<b>Adet farkı yok.</b> ')+(priceOnly?priceOnly+' kalemde yalnızca birim fiyat farklı.':""):"Okunan belgeler siparişle uyumlu.")+'</div>';
  h+='<div class="card"><div class="card-h"><h2>Kalem karşılaştırması ('+esc(o.currency)+')</h2><span class="small muted">adet × birim fiyat</span></div>';
  if(!rows.size)h+='<div class="empty">Karşılaştırılacak kalem yok.</div></div>';
  else h+='<div class="scroll"><table><thead><tr><th>Model</th><th class="num">Sipariş</th><th class="num">Proforma</th><th class="num">Ticari fatura</th><th>Durum</th></tr></thead><tbody>'+body+'</tbody><tfoot><tr><td>Toplam</td><td class="num mono">'+nf.format(sumOf("s"))+'</td><td class="num">'+tot("p",pf)+'</td><td class="num">'+tot("f",ft)+'</td><td></td></tr></tfoot></table></div></div>';
  const src=[...pf.docs,...ft.docs];
  if(src.length)h+='<div class="card"><h2 style="margin-bottom:6px">Okunan belgeler</h2><ul class="small" style="margin:0;padding-left:18px">'+src.map(d=>'<li>'+esc(d.name||"Belge")+(d.read.no?', no <span class="mono">'+esc(d.read.no)+'</span>':"")+(d.read.date?', '+esc(fmtDate(d.read.date)):"")+' · '+esc(d.read.method)+'</li>').join("")+'</ul></div>';
  h+='<div class="card small muted">Beyanname kıymeti, vergiler ve teslim alınan adet karşılaştırması sonraki adımda, gerçek beyanname ve müşavir dökümü örneklerine göre eklenecek.</div>';
  return h;
}

function syncText(){
  if(S.auth==="out")return "";
  if(S.auth==="expired")return "Oturum süresi doldu";
  if(S.pending>0||S.syncing)return "Drive'a kaydediliyor";
  if(S.syncErr)return "Kaydedilemedi";
  if(S.orders.some(o=>o._dirty))return "Gönderilmeyi bekliyor";
  return "Drive'a kaydedildi";
}
function renderSync(){
  const t=syncText();const f=$("#railFoot");
  if(f){f.textContent="";if(S.email&&S.auth!=="out"){const e=document.createElement("div");e.textContent=S.email;e.style.overflowWrap="anywhere";f.appendChild(e)}const s=document.createElement("div");s.textContent=t;f.appendChild(s)}

function render(){
  const ae=document.activeElement;const fid=ae&&ae.id&&$("#main").contains(ae)?ae.id:null;
  let ss0=null,se0=null;try{if(fid&&ae.selectionStart!=null){ss0=ae.selectionStart;se0=ae.selectionEnd}}catch(e){}
  let o=S.view==="dosya"?getOrder(S.sel):null;
  if(S.view==="dosya"&&!o&&S.loaded){S.view="siparisler"}
  let html;
  if(S.view==="hesap")html=viewAccount();

  else html=S.view==="arsiv"?viewArchive():(S.view==="dosya"&&o)?viewOrder(o):viewList();
  $("#main").innerHTML=html;
  const navKey=S.view==="arsiv"?"arsiv":S.view==="hesap"?"hesap":"siparisler";
  document.querySelectorAll("[data-nav]").forEach(a=>{if(a.dataset.nav===navKey)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});

  $("#navCount").textContent=shown?S.orders.length:"";
  $("#navDocs").textContent=shown?S.orders.reduce((s,x)=>s+(x.docs||[]).length,0):"";

async function copyLog(btn){
  const txt=LOG.join("\n");
  try{await navigator.clipboard.writeText(txt);btn.textContent="Kopyalandı"}
  catch(e){const b=$("#logBox");if(b){const r=document.createRange();r.selectNodeContents(b);const s=getSelection();s.removeAllRanges();s.addRange(r)}btn.textContent="Seçildi, elle kopyalayın"}
  setTimeout(()=>{btn.textContent="Günlüğü kopyala"},2500);

function globalAction(a,t,e){
  if(a==="login-popup"){loginPopup();return true}
  if(a==="login-redirect"){loginRedirect();return true}
  if(a==="logout"){confirmBox("Çıkış yapılsın mı?","Bu cihazdaki kopya silinir. Drive'daki siparişleriniz ve belgeleriniz yerinde kalır.","Çıkış yap",()=>signOut());return true}
  if(a==="retry-sync"){S.syncErr="";pushAllDirty();syncDown();return true}
  if(a==="refresh"){syncDown().then(()=>pushAllDirty());return true}
  if(a==="copy-log"){copyLog(t);return true}
  if(a==="new-order"){e.preventDefault();if(S.auth==="out"){toast("Önce giriş yapın.");return true}orderDialog(null);return true}
  return false;
}

async function start(){
  log("Ortam: "+(standalone?"ana ekran uygulaması":"tarayıcı sekmesi")+", sürüm "+APP_VERSION);
  log("Tarayıcı: "+navigator.userAgent);
  const back=handleRedirectReturn();
  const cached=await idb.get("orders");
  if(Array.isArray(cached)&&cached.length){S.orders=cached;sortOrders();S.loaded=true}
  let saved=null;try{saved=JSON.parse(ss.get("ithalat.tok")||"null")}catch(e){}
  if(back&&back.token){route();setToken(back.token,back.expiresIn,"yönlendirme");return}
  if(back&&back.error)S.loginErr=back.error;
  if(saved&&saved.token&&saved.tokenUntil>Date.now()+60000){token=saved.token;tokenUntil=saved.tokenUntil;S.auth="in";log("Önceki oturum hâlâ geçerli.");route();boot();return}
  S.auth=S.loaded?"expired":"out";
  route();
}
window.addEventListener("hashchange",route);
window.addEventListener("online",()=>{if(S.auth==="in"){log("Bağlantı geri geldi.");pushAllDirty()}});
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState!=="visible"||S.auth!=="in")return;
  if(tokenUntil&&Date.now()>tokenUntil-30000){expire();return}
  if(Date.now()-(syncDown.last||0)>60000){syncDown.last=Date.now();syncDown().then(()=>pushAllDirty())}
});
start();

</script>
